name: Packer CI - Build Custom Image

on:
  pull_request:
    branches:
      - 'main'
    types:
      - closed

permissions:
  contents: read

jobs:
  if_merged:
    if: github.event.pull_request.merged == true
    name: Build Jar and Create Custom Image
    runs-on: ubuntu-latest
    env:
      DB_DATABASE: cloudDatabase
      DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      PKR_VAR_project_id: ${{secrets.project_id}}
      PKR_VAR_source_image: ${{secrets.source_image}}
      PKR_VAR_image_name: ${{secrets.image_name}}
      PKR_VAR_zone: ${{secrets.zone}}
      PKR_VAR_disk_size: ${{secrets.disk_size}}
      PKR_VAR_network: ${{secrets.network}}
      PKR_VAR_communicator: ${{secrets.communicator}}
      PKR_VAR_ssh_username: ${{secrets.ssh_username}}
      PKR_VAR_ssh_password: ${{secrets.ssh_password}}
      PKR_VAR_ssh_timeout: ${{secrets.ssh_timeout}}
      PKR_VAR_service_account_email: ${{secrets.service_account_email}}
      PKR_VAR_service_account_json: ${{secrets.service_account_json}}
      MACHINE_TYPE: ${{secrets.MACHINE_TYPE}}
      REGION: ${{secrets.REGION}}
      GCLOUD_NETWORK: ${{secrets.GCLOUD_NETWORK}}
      SUBNET: ${{secrets.SUBNET}}
      VM_INSTANCE_SERVICE_ACCOUNT: ${{secrets.VM_INSTANCE_SERVICE_ACCOUNT}}
      INSTANCE_GRP_MANAGER: ${{secrets.INSTANCE_GRP_MANAGER}}
      INSTANCE_TEMPLATE: ${{secrets.INSTANCE_TEMPLATE}}
      ROLLING_ACTION_TYPE: ${{secrets.ROLLING_ACTION_TYPE}}
      VM_DISK_SIZE: ${{secrets.VM_DISK_SIZE}}
      VM_DISK_TYPE: ${{secrets.VM_DISK_TYPE}}


    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start MySQL and create database
        run: |
          sudo /etc/init.d/mysql start
          
      - name: GCP Credentials
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{secrets.GCP_CREDENTIALS}}'

      - name: Build with Maven
        run: |
          sudo chmod 733 /var/log/
          mvn -B package --file pom.xml

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        id: setup-packer

      - name: Init and Build Custom Image with Packer
        working-directory: ./packer
        run: |
          packer init .
          packer fmt -check .
          packer validate .
          packer build .
          
      - name: Storing Image Name
        working-directory: ./packer
        run: |
          VM_IMAGE_NAME=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d ":" -f2) && echo "VM_IMAGE_NAME=$VM_IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Generate random string
        id: random-string
        run: echo "RANDOM_STRING=$(uuidgen | tr -d '-')" >> $GITHUB_ENV

      - id: 'secrets'
        uses: 'google-github-actions/get-secretmanager-secrets@v2'
        with:
          # Only the disk encryption key path is needed here. DB credentials are
          # read by each VM at boot (deploy/startup.sh), never put in metadata.
          secrets: |-
            vm-kms-encryption:projects/${{ secrets.project_id }}/secrets/vm-kms-encryption

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Create instance template from the new image'
        env:
          PROJECT_ID: ${{ secrets.project_id }}
          VM_KMS_KEY: ${{ steps.secrets.outputs.vm-kms-encryption }}
        run: |
          # --no-address: VMs get no public IP (ingress only via the LB, egress via Cloud NAT)
          # kms-key: keep boot disks on the customer-managed key, same as the Terraform template
          # cloud-platform scope: lets the VM's service account read Secret Manager at boot
          gcloud compute instance-templates create "$INSTANCE_TEMPLATE-$RANDOM_STRING" \
            --project="$PROJECT_ID" \
            --machine-type="$MACHINE_TYPE" \
            --instance-template-region="$REGION" \
            --create-disk="image=projects/$PROJECT_ID/global/images/$VM_IMAGE_NAME,size=$VM_DISK_SIZE,type=$VM_DISK_TYPE,auto-delete=yes,boot=true,kms-key=$VM_KMS_KEY" \
            --network="$GCLOUD_NETWORK" \
            --subnet="$SUBNET" \
            --no-address \
            --metadata-from-file=startup-script=deploy/startup.sh \
            --service-account="$VM_INSTANCE_SERVICE_ACCOUNT" \
            --scopes=cloud-platform \
            --tags=web

      - name: 'Point the managed instance group at the new template'
        env:
          PROJECT_ID: ${{ secrets.project_id }}
        run: |
          gcloud compute instance-groups managed set-instance-template "$INSTANCE_GRP_MANAGER" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --template="projects/$PROJECT_ID/regions/$REGION/instanceTemplates/$INSTANCE_TEMPLATE-$RANDOM_STRING"

      - name: 'Rolling update with no capacity loss'
        env:
          PROJECT_ID: ${{ secrets.project_id }}
        run: |
          # Surge new VMs first and never take an old one down before its
          # replacement is healthy (previously --max-unavailable=3).
          gcloud compute instance-groups managed rolling-action start-update "$INSTANCE_GRP_MANAGER" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --max-surge=3 \
            --max-unavailable=0 \
            --type="$ROLLING_ACTION_TYPE" \
            --version="template=projects/$PROJECT_ID/regions/$REGION/instanceTemplates/$INSTANCE_TEMPLATE-$RANDOM_STRING"

      - name: 'Wait until every VM runs the new template'
        env:
          PROJECT_ID: ${{ secrets.project_id }}
        run: |
          gcloud compute instance-groups managed wait-until "$INSTANCE_GRP_MANAGER" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --version-target-reached \
            --timeout=1200

      - name: 'Describe the instance group status'
        env:
          PROJECT_ID: ${{ secrets.project_id }}
        run: |
          gcloud compute instance-groups managed describe "$INSTANCE_GRP_MANAGER" \
            --project="$PROJECT_ID" \
            --region="$REGION"
