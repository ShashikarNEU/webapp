name: Integration test

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  build:
    name: Testing maven file
    runs-on: ubuntu-latest
    env:
      DB_DATABASE: cloudDatabase
      DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_URL: ${{secrets.DATABASE_URL}}

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Start MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -h 127.0.0.1 -e "CREATE DATABASE IF NOT EXISTS $DB_DATABASE;" -u$DATABASE_USERNAME -p$DATABASE_PASSWORD

      - name: GCP Credentials
        uses: 'google-github-actions/auth@v2'
        with:
          # Keyless: GitHub's OIDC token is exchanged for short-lived GCP creds
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Build with Maven
        run: |
          sudo chmod 733 /var/log/
          mvn test --file pom.xml